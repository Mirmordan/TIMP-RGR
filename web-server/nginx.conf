server {
    listen 80;
    server_name _;

    # --- API: прокси на бэкенд ---
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hls/ {
        auth_request /_hlsauth;
        proxy_pass http://127.0.0.1:9999/hls/;
        proxy_set_header Host $host;
    }
    location = /_hlsauth {
        internal;
        proxy_pass http://127.0.0.1:5000/api/v1/recordings/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # mediaMTX live (включая view-сессии /live/view_*): только под авторизацией.
    location /live/ {
        auth_request /_hlsauth-1;
        rewrite ^/live/(.*) /$1 break;
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_valid 200 1s;
    }
    location = /_hlsauth-1 {
        internal;
        proxy_pass http://127.0.0.1:5000/api/v1/recordings/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    # --- SPA + assets: all-in-one приложение (backend отдаёт /public) ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
